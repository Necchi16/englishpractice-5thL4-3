    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in-up { animation: fadeInUp 0.6s ease-out forwards; }
    @keyframes bounceIn { 0% { transform: scale(0.1); opacity: 0; } 60% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
    .animate-bounce-in { animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    * { -webkit-tap-highlight-color: transparent; font-family: 'UD Digi Kyokasho N-R', 'UD Digi Kyokasho N-B', 'Klee One', 'BIZ UDPGothic', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }

    .font-note { font-family: 'UD Digi Kyokasho N-R', 'UD Digi Kyokasho N-B', 'Klee One', 'BIZ UDPGothic', sans-serif; letter-spacing: 0.05em; }
    .slide-bg { background: linear-gradient(135deg, #000 0%, #111 100%); }
    
    .shake-animation { animation: shake 0.5s; }
    @keyframes shake {
      0% { transform: translate(1px, 1px) rotate(0deg); }
      10% { transform: translate(-1px, -2px) rotate(-1deg); }
      20% { transform: translate(-3px, 0px) rotate(1deg); }
      30% { transform: translate(3px, 2px) rotate(0deg); }
      40% { transform: translate(1px, -1px) rotate(1deg); }
      50% { transform: translate(-1px, 2px) rotate(-1deg); }
      60% { transform: translate(-3px, 1px) rotate(0deg); }
      70% { transform: translate(3px, 1px) rotate(-1deg); }
      80% { transform: translate(-1px, -1px) rotate(1deg); }
      90% { transform: translate(1px, 2px) rotate(0deg); }
      100% { transform: translate(1px, -2px) rotate(-1deg); }
    }

    const GAS_URLS = [
      "https://script.google.com/macros/s/AKfycbweESd0ikrHJl6Pl5lPnniXgoUWW45_YDUIAXuCBYKkclBs3T47GX83B5q-GAc8Hw3sPQ/exec",

    ];

    // --- ミニゲーム コンポーネント ---
    const CoinGame = ({ playerEmoji, helpers, onFinish }) => {
      const canvasRef = useRef(null);
      const [timeLeft, setTimeLeft] = useState(15);
      const requestRef = useRef();
      
      const stateRef = useRef({
        player: { x: 150, y: 150, size: 40, speed: 5, frozenFrames: 0 },
        coins: [],
        monsters: [],
        helperBots: helpers.map(h => ({
          x: Math.random() * 260 + 20, y: Math.random() * 360 + 20,
          size: 40, emoji: h.emoji,
          dx: (Math.random() - 0.5) * 6, dy: (Math.random() - 0.5) * 6
        })),
        keys: {},
        score: 0,
        width: 300,
        height: 400,
        isPlaying: true
      });

      useEffect(() => {
        const w = window.innerWidth > 500 ? 500 : window.innerWidth - 40;
        stateRef.current.width = w;
        
        for(let i=0; i<6; i++) spawnCoin();
        for(let i=0; i<3; i++) spawnMonster();
        
        const handleKeyDown = (e) => { if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) { stateRef.current.keys[e.key] = true; e.preventDefault(); }};
        const handleKeyUp = (e) => { if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) { stateRef.current.keys[e.key] = false; e.preventDefault(); }};
        window.addEventListener('keydown', handleKeyDown, {passive: false});
        window.addEventListener('keyup', handleKeyUp);
        
        const timer = setInterval(() => {
          setTimeLeft(prev => {
            if(prev <= 1) {
              clearInterval(timer);
              stateRef.current.isPlaying = false;
              return 0;
            }
            return prev - 1;
          });
        }, 1000);

        const loop = () => {
          if(!stateRef.current.isPlaying) return;
          update();
          draw();
          requestRef.current = requestAnimationFrame(loop);
        };
        requestRef.current = requestAnimationFrame(loop);

        return () => {
          window.removeEventListener('keydown', handleKeyDown);
          window.removeEventListener('keyup', handleKeyUp);
          clearInterval(timer);
          cancelAnimationFrame(requestRef.current);
        };
      }, []);

      useEffect(() => {
        if(timeLeft === 0) onFinish(stateRef.current.score);
      }, [timeLeft, onFinish]);

      const spawnCoin = () => {
        const { width, height } = stateRef.current;
        stateRef.current.coins.push({ x: Math.random() * (width - 40) + 20, y: Math.random() * (height - 40) + 20, size: 20 });
      };

      const spawnMonster = () => {
        const { width, height } = stateRef.current;
        stateRef.current.monsters.push({
          x: Math.random() * (width - 60) + 30, y: Math.random() * (height - 60) + 30,
          size: 40, dx: (Math.random() - 0.5) * 4, dy: (Math.random() - 0.5) * 4
        });
      };

      const update = () => {
        const state = stateRef.current;
        const { player, coins, monsters, helperBots, keys, width, height } = state;

        // お助けキャラの動きとエイリアン討伐
        helperBots.forEach(h => {
          h.x += h.dx;
          h.y += h.dy;
          if (h.x < h.size/2 || h.x > width - h.size/2) h.dx *= -1;
          if (h.y < h.size/2 || h.y > height - h.size/2) h.dy *= -1;

          for (let i = monsters.length - 1; i >= 0; i--) {
            const m = monsters[i];
            if (Math.hypot(h.x - m.x, h.y - m.y) < (h.size + m.size) / 2) {
              monsters.splice(i, 1);
              spawnMonster(); // 倒したら新しいのをスポーン
            }
          }
        });

        // プレイヤーの動き
        if (player.frozenFrames > 0) {
          player.frozenFrames--;
        } else {
          let dx = 0, dy = 0;
          if (keys['ArrowUp']) dy -= player.speed;
          if (keys['ArrowDown']) dy += player.speed;
          if (keys['ArrowLeft']) dx -= player.speed;
          if (keys['ArrowRight']) dx += player.speed;
          
          player.x += dx;
          player.y += dy;
          player.x = Math.max(player.size/2, Math.min(width - player.size/2, player.x));
          player.y = Math.max(player.size/2, Math.min(height - player.size/2, player.y));
        }

        // モンスターの動きとプレイヤーとの衝突
        monsters.forEach(m => {
          m.x += m.dx;
          m.y += m.dy;
          if (m.x < m.size/2 || m.x > width - m.size/2) m.dx *= -1;
          if (m.y < m.size/2 || m.y > height - m.size/2) m.dy *= -1;

          if (player.frozenFrames === 0) {
            const dist = Math.hypot(player.x - m.x, player.y - m.y);
            if (dist < (player.size + m.size) / 2 - 5) {
              player.frozenFrames = 60;
              const canvas = canvasRef.current;
              if(canvas) {
                canvas.classList.add('shake-animation');
                setTimeout(() => canvas.classList.remove('shake-animation'), 500);
              }
            }
          }
        });

        // コイン獲得
        for (let i = coins.length - 1; i >= 0; i--) {
          const c = coins[i];
          if (Math.hypot(player.x - c.x, player.y - c.y) < (player.size + c.size) / 2) {
            coins.splice(i, 1);
            state.score++;
            spawnCoin();
          }
        }
      };

      const draw = () => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const state = stateRef.current;

        ctx.clearRect(0, 0, state.width, state.height);
        
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 1;
        for(let i=0; i<state.width; i+=40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i, state.height); ctx.stroke(); }
        for(let i=0; i<state.height; i+=40) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(state.width, i); ctx.stroke(); }

        state.coins.forEach(c => {
          ctx.beginPath();
          ctx.arc(c.x, c.y, c.size/2, 0, Math.PI * 2);
          ctx.fillStyle = '#fbbf24';
          ctx.fill();
          ctx.strokeStyle = '#d97706';
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.fillStyle = '#d97706';
          ctx.font = '12px Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('¥', c.x, c.y);
        });

        state.helperBots.forEach(h => {
          ctx.font = `${h.size}px Arial`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(h.emoji, h.x, h.y);
        });

        state.monsters.forEach(m => {
          ctx.font = `${m.size}px Arial`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('👾', m.x, m.y);
        });

        const p = state.player;
        ctx.globalAlpha = p.frozenFrames > 0 && Math.floor(p.frozenFrames / 10) % 2 === 0 ? 0.5 : 1.0; 
        ctx.font = `${p.size}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(playerEmoji, p.x, p.y);
        ctx.globalAlpha = 1.0;
        
        if(p.frozenFrames > 0) {
          ctx.fillStyle = 'red';
          ctx.font = '24px Arial bold';
          ctx.fillText('💥', p.x, p.y - p.size);
        }
      };

      const handleBtn = (key, isDown) => { stateRef.current.keys[key] = isDown; };

      return (
        <div className="flex flex-col items-center bg-gray-900 p-4 rounded-3xl border-4 border-gray-700 shadow-2xl touch-none">
          <div className="flex justify-between w-full mb-4 px-2">
            <div className="text-xl font-bold text-white bg-gray-800 px-4 py-1 rounded-full border-2 border-gray-600">⏳ {timeLeft}</div>
            <div className="text-xl font-bold text-yellow-400 bg-gray-800 px-4 py-1 rounded-full border-2 border-gray-600">🪙 {stateRef.current.score}</div>
          </div>
          <div className="bg-gray-800 rounded-xl overflow-hidden shadow-inner">
            <canvas ref={canvasRef} width={stateRef.current.width} height={stateRef.current.height} />
          </div>
          
          <div className="grid grid-cols-3 gap-2 mt-4 md:hidden w-full max-w-[250px]">
            <div />
            <button onPointerDown={() => handleBtn('ArrowUp', true)} onPointerUp={() => handleBtn('ArrowUp', false)} onPointerLeave={() => handleBtn('ArrowUp', false)} className="bg-gray-700 text-white p-4 rounded-xl text-2xl active:bg-blue-600 flex items-center justify-center">⬆️</button>
            <div />
            <button onPointerDown={() => handleBtn('ArrowLeft', true)} onPointerUp={() => handleBtn('ArrowLeft', false)} onPointerLeave={() => handleBtn('ArrowLeft', false)} className="bg-gray-700 text-white p-4 rounded-xl text-2xl active:bg-blue-600 flex items-center justify-center">⬅️</button>
            <button onPointerDown={() => handleBtn('ArrowDown', true)} onPointerUp={() => handleBtn('ArrowDown', false)} onPointerLeave={() => handleBtn('ArrowDown', false)} className="bg-gray-700 text-white p-4 rounded-xl text-2xl active:bg-blue-600 flex items-center justify-center">⬇️</button>
            <button onPointerDown={() => handleBtn('ArrowRight', true)} onPointerUp={() => handleBtn('ArrowRight', false)} onPointerLeave={() => handleBtn('ArrowRight', false)} className="bg-gray-700 text-white p-4 rounded-xl text-2xl active:bg-blue-600 flex items-center justify-center">➡️</button>
          </div>
          <p className="text-gray-400 mt-4 text-sm text-center font-bold">やじるしキー（または ボタン）で うごかして コインを あつめよう！<br/>なかま が エイリアンを やっつけてくれるよ！</p>
        </div>
      );
    };

    function App() {
      const [step, setStep] = useState('HOME'); 
      const [totalCoins, setTotalCoins] = useState(0);
      const [items, setItems] = useState({ salmon: 0 });
      const [kummaniLevel, setKummaniLevel] = useState(1);
      const [kummaniExp, setKummaniExp] = useState(0);
      const [helpers, setHelpers] = useState([]); // お助けキャラリスト
      const [cookedDishes, setCookedDishes] = useState([]); // 作った料理履歴
      
      const [inputs, setInputs] = useState([
        { pronoun: 'He', name: '', action: '' },
        { pronoun: 'She', name: '', action: '' }
      ]);
      const [answers, setAnswers] = useState(null);
      const [translatingState, setTranslatingState] = useState({});
      const [fallbackMode, setFallbackMode] = useState({});
      const [manualInputs, setManualInputs] = useState({});
      
      const [savedWorks, setSavedWorks] = useState([]);
      const [viewingWork, setViewingWork] = useState(null);
      const [currentSlideIndex, setCurrentSlideIndex] = useState(0);

      const [currentSpeakLine, setCurrentSpeakLine] = useState(0);
      const [isListening, setIsListening] = useState(false);
      const [feedbackMsg, setFeedbackMsg] = useState("");
      const [failCount, setFailCount] = useState(0);
      
      const [feedEffect, setFeedEffect] = useState(null);
      const [showNoteConfirm, setShowNoteConfirm] = useState(false);

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const synth = window.speechSynthesis;

      useEffect(() => {
        const load = (key, setter, isObj = false) => {
          const val = localStorage.getItem(key);
          if (val) setter(isObj ? JSON.parse(val) : parseInt(val, 10));
        };
        load('englishAppCoins_V2', setTotalCoins);
        load('englishAppItems_V2', setItems, true);
        load('englishAppKummaniLevel_V2', setKummaniLevel);
        load('englishAppKummaniExp_V2', setKummaniExp);
        load('englishAppHelpers_V2', setHelpers, true);
        load('englishAppWorks_V2', setSavedWorks, true);
        load('englishAppDishes_V2', setCookedDishes, true);
      }, []);

      const saveProgress = (newCoins, newItems, newLevel, newExp, newHelpers = helpers, newDishes = cookedDishes) => {
        localStorage.setItem('englishAppCoins_V2', newCoins.toString());
        localStorage.setItem('englishAppItems_V2', JSON.stringify(newItems));
        localStorage.setItem('englishAppKummaniLevel_V2', newLevel.toString());
        localStorage.setItem('englishAppKummaniExp_V2', newExp.toString());
        localStorage.setItem('englishAppHelpers_V2', JSON.stringify(newHelpers));
        localStorage.setItem('englishAppDishes_V2', JSON.stringify(newDishes));
        
        setTotalCoins(newCoins); setItems(newItems); setKummaniLevel(newLevel); 
        setKummaniExp(newExp); setHelpers(newHelpers); setCookedDishes(newDishes);
      };

      const saveWork = (workData) => {
        const newWorks = [workData, ...savedWorks];
        localStorage.setItem('englishAppWorks_V2', JSON.stringify(newWorks));
        setSavedWorks(newWorks);
      };

      const speak = useCallback((text) => {
        if (synth.speaking) synth.cancel();
        const utterThis = new SpeechSynthesisUtterance(text);
        utterThis.lang = 'en-US';
        utterThis.rate = 0.9;
        synth.speak(utterThis);
      }, [synth]);

      const cleanTrans = (text, pronoun) => {
        if (!text) return "";
        let s = text.trim();
        s = s.replace(/[\.\,\!]+$/, "").trim(); // ピリオド削除
        
        if (pronoun) {
          const prefixRegex = new RegExp(`^${pronoun}\\s+can\\s+`, 'i');
          s = s.replace(prefixRegex, "");
        }
        
        return s;
      };

      const translateWithGAS = async (text) => {
        const urls = [...GAS_URLS].sort(() => 0.5 - Math.random());
        for (const url of urls) {
          try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 4000);
            const res = await fetch(`${url}?text=${encodeURIComponent(text)}`, { signal: controller.signal });
            clearTimeout(timeoutId);
            const data = await res.json();
            if (data && data.text) return data.text; // 大文字小文字維持
          } catch (e) {
            console.warn("GAS translation failed, trying next...");
          }
        }
        throw new Error("All GAS URLs failed");
      };

      const handleTranslateSingle = async (idx) => {
        if (!inputs[idx].name || !inputs[idx].name.trim()) {
          alert("なまえを にゅうりょく してね！");
          return;
        }
        if (!inputs[idx].action.trim()) {
          alert("なにができるか にゅうりょく してね！");
          return;
        }
        setTranslatingState(prev => ({ ...prev, [idx]: true }));
        setFallbackMode(prev => ({ ...prev, [idx]: false }));
        
        const prefix = inputs[idx].pronoun === 'He' ? '彼は ' : '彼女は ';
        const query = `${prefix}${inputs[idx].action}ことができます。`;

        let isDone = false;
        const fallbackTimer = setTimeout(() => {
          if (!isDone) {
            setFallbackMode(prev => ({ ...prev, [idx]: true }));
          }
        }, 3000);

        try {
          const enText = await translateWithGAS(query);
          isDone = true;
          clearTimeout(fallbackTimer);
          
          const newAnswers = answers ? [...answers] : Array(inputs.length).fill(null);
          newAnswers[idx] = { ...inputs[idx], en: cleanTrans(enText, inputs[idx].pronoun), img: "" };
          setAnswers(newAnswers);
          setTranslatingState(prev => ({ ...prev, [idx]: false }));
          setFallbackMode(prev => ({ ...prev, [idx]: false }));
        } catch (err) {
          isDone = true;
          clearTimeout(fallbackTimer);
          setFallbackMode(prev => ({ ...prev, [idx]: true }));
          setTranslatingState(prev => ({ ...prev, [idx]: false }));
        }
      };

      const handleManualTranslateComplete = (idx) => {
        if (!manualInputs[idx]) return;
        const newAnswers = answers ? [...answers] : Array(inputs.length).fill(null);
        newAnswers[idx] = { ...inputs[idx], en: cleanTrans(manualInputs[idx], inputs[idx].pronoun), img: "" };
        setAnswers(newAnswers);
        setFallbackMode(prev => ({ ...prev, [idx]: false }));
      };

      // 音声認識 (90%以上一致で正解)
      const startListening = (targetSentence) => {
        if (!SpeechRecognition) {
            alert("マイクが使えません。スキップして進んでください。");
            setFailCount(2);
            return;
        }
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        setIsListening(true);
        setFeedbackMsg("");

        recognition.onresult = (event) => {
          const trans = event.results[0][0].transcript.toLowerCase();
          
          // 記号と空白を除去して文字レベルで一致率を計算する
          const cleanTransStr = trans.replace(/[^a-z]/g, '');
          const cleanTargetStr = targetSentence.toLowerCase().replace(/[^a-z]/g, '');
          
          let matchCount = 0;
          const minLen = Math.min(cleanTransStr.length, cleanTargetStr.length);
          const maxLen = Math.max(cleanTransStr.length, cleanTargetStr.length);
          
          for(let i=0; i<minLen; i++){
            if(cleanTransStr[i] === cleanTargetStr[i]) matchCount++;
          }
          const matchRate = maxLen > 0 ? (matchCount / maxLen) : 0;
          
          if (matchRate >= 0.9 || trans === targetSentence.toLowerCase().replace(/[.]/g, '')) {
            setFeedbackMsg("Excellent! 👏");
            setFailCount(0);
            setTimeout(() => {
              setFeedbackMsg("");
              setCurrentSpeakLine(c => c + 1);
            }, 1500);
          } else {
            setFailCount(c => c + 1);
            setFeedbackMsg("おしい！もう一度！\n(" + trans + " と聞こえました)");
          }
        };
        recognition.onerror = () => { 
            setFailCount(c => c + 1);
            setFeedbackMsg("エラーがおきました。もう一度ボタンをおしてね。"); 
            setIsListening(false); 
        };
        recognition.onend = () => setIsListening(false);
        recognition.start();
      };

      const handleGameFinish = (coins) => {
        saveProgress(totalCoins + coins, items, kummaniLevel, kummaniExp);

      const feedKummani = () => {
        if (items.salmon >= 1) {

          // 未作成の料理を優先
          const unownedDishes = DISHES.filter(d => !cookedDishes.includes(d));
          const dish = unownedDishes.length > 0 ? unownedDishes[Math.floor(Math.random() * unownedDishes.length)] : DISHES[Math.floor(Math.random() * DISHES.length)];

          setFeedEffect({ phase: 'cooking' });
          
          setTimeout(() => {
            setFeedEffect({ phase: 'done', dish, newItems });
          }, 1500);
        }
      };

      const handleDeliciousClick = () => {
        const { dish, newItems } = feedEffect;
        const newDishes = cookedDishes.includes(dish) ? cookedDishes : [...cookedDishes, dish];
        
        const currentStage = KUMMANI_STAGES[kummaniLevel] || KUMMANI_STAGES[1];
        const newExp = kummaniExp + 1;

            setFeedEffect({ phase: 'evolving', from: currentStage, to: nextStage });
            setTimeout(() => {

            <div className="max-w-2xl w-full mx-auto bg-white rounded-3xl shadow-xl border-4 border-blue-200 overflow-hidden">

              <div className="p-6 text-center">
                
                {/* 作った作品を一番上に */}

                  <div className="mb-8 text-left bg-gray-50 p-4 rounded-xl border-2 border-gray-200">

                            <button onClick={() => { setViewingWork(work); setStep('VIEW_SLIDESHOW'); }} className="text-sm bg-blue-100 hover:bg-blue-200 text-blue-800 font-bold py-2 px-4 rounded shadow-sm border border-blue-300">スライド</button>
                          </div>

                )}
                
                <button onClick={() => {

                {savedWorks.length > 0 && (

                    <h3 className="text-xl font-bold text-indigo-800 mb-3">🎉 スライドかんせい おめでとう！</h3>

                  </div>
                  
                  <div className="flex justify-center mb-4">
                     <button onClick={() => {
                       if (totalCoins >= 3) saveProgress(totalCoins - 3, { ...items, salmon: items.salmon + 1 }, kummaniLevel, kummaniExp);
                     }} disabled={totalCoins < 3} className={`py-2 px-6 rounded-xl font-bold shadow text-sm transition ${totalCoins >= 3 ? 'bg-blue-500 hover:bg-blue-600 text-white' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}`}>

                     </button>

                    </div>
                    <button onClick={feedKummani} disabled={items.salmon < 1} className={`w-full py-3 rounded-xl font-bold shadow-md text-lg ${items.salmon >= 1 ? 'bg-orange-500 hover:bg-orange-600 text-white' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}`}>

                  {helpers.length > 0 && (

                      <div className="flex flex-wrap gap-2">
                        {helpers.map((h, i) => (
                          <div key={i} className="bg-white px-3 py-1 rounded-full border border-purple-200 shadow-sm text-sm" title={h.name}>{h.emoji}</div>
                        ))}
                      </div>
                    </div>
                  )}

                  {cookedDishes.length > 0 && (
                    <div className="mt-6 p-4 bg-orange-50 rounded-2xl text-left border-2 border-orange-200 shadow-sm">
                      <h4 className="font-bold text-orange-800 mb-3 flex items-center"><span className="mr-2 text-xl">🍽️</span> 作った料理のきろく ({cookedDishes.length} / {DISHES.length})</h4>
                      <ul className="text-sm font-bold text-gray-700 list-disc pl-6 space-y-2">

                      </ul>
                      {cookedDishes.length > 5 && <p className="text-xs text-gray-500 mt-2 pl-2">...ほか {cookedDishes.length - 5} こ</p>}
                    </div>
                  )}
                </div>
              </div>
            </div>
          </div>
        );
      } else if (step === 'INPUT') {
        const isAllTranslated = answers && answers.length === inputs.length && answers.every((ans, i) => ans && ans.action === inputs[i].action && ans.name === inputs[i].name);

        content = (
          <div className="min-h-screen p-4 flex flex-col items-center py-8 relative">
            <BackButton />
            <div className="w-full max-w-xl text-center pb-24">
              <h2 className="text-2xl font-bold text-pink-700 mb-6 bg-pink-100 py-2 rounded-full border-2 border-pink-200 shadow-sm">He / She can を つかおう！</h2>
              
              {inputs.map((inp, idx) => (
                <div key={idx} className="bg-white p-4 md:p-6 rounded-2xl mb-6 border-4 border-pink-100 shadow-md text-left">

                      <h4 className="font-bold text-red-700 mb-3 text-lg">もし、ほんやくが ずっとできないままだったら💦</h4>
                      
                      <p className="text-sm text-gray-700 mb-4 pt-1">Googleほんやくを ひらいて えいごに してみよう！</p>
                      
                      <a href="https://translate.google.co.jp/?sl=ja&tl=en" target="_blank" rel="noopener noreferrer" className="block text-center bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded-lg mb-4 shadow-sm transition">🌐 Googleほんやく をひらく</a>
                      
                      <p className="text-sm font-bold text-gray-600 mb-2">「{inp.pronoun === 'He' ? '彼は' : '彼女は'}{inp.action}ことができます」→えいごを ここに はりつけ↓</p>
                      <input type="text" value={manualInputs[idx] || ''} onChange={e => setManualInputs({...manualInputs, [idx]: e.target.value})} className="w-full p-3 border-2 border-gray-300 rounded-lg focus:bg-white bg-gray-50 mb-3 font-bold" />
                      <button onClick={() => handleManualTranslateComplete(idx)} className="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-lg shadow-sm mb-2">けってい！</button>
                      <button onClick={() => setFallbackMode(prev => ({...prev, [idx]: false}))} className="w-full text-sm text-gray-500 underline py-2 mt-2">もういちど ほんやくボタンを だす</button>
                    </div>
                  ) : (
                    <button onClick={() => handleTranslateSingle(idx)} className="w-full mt-2 bg-pink-500 hover:bg-pink-600 text-white text-lg font-bold py-4 rounded-xl shadow-md transition transform hover:-translate-y-1">
                      えいごに ほんやく！
                    </button>
                  )}
                </div>
              ))}
              
              {isAllTranslated && (
                <div className="fixed bottom-0 left-0 right-0 p-4 bg-white/90 backdrop-blur border-t-2 border-pink-100 flex justify-center shadow-[0_-10px_20px_rgba(0,0,0,0.05)] z-40">
                  <button onClick={() => setStep('IMAGE_INPUT')} className="w-full max-w-xl bg-blue-500 hover:bg-blue-600 text-white text-2xl font-bold py-5 rounded-2xl shadow-lg transition transform hover:scale-105 animate-bounce-in">
                    つぎへ すすむ！ ▶️
                  </button>
                </div>
              )}
            </div>
          </div>
        );
      } else if (step === 'IMAGE_INPUT') {
        content = (
          <div className="min-h-screen p-4 flex flex-col items-center py-8 relative">
            <BackButton />
            <div className="w-full max-w-3xl bg-white p-6 md:p-8 rounded-3xl shadow-xl border-4 border-blue-200 mt-8">
              <h2 className="text-2xl font-bold text-blue-700 mb-6 text-center">スライドに使う 有名人の がぞうを さがそう🖼️</h2>
              
              <div className="bg-yellow-100 p-8 rounded-2xl mb-8 text-xl md:text-2xl font-bold text-gray-800 shadow-md border-4 border-yellow-400">
                <ol className="list-decimal pl-8 space-y-6">
                  <li>新しいタブで 有名人の名前を <span className="text-red-500 bg-white px-2 rounded border border-red-200">画像けんさく</span> する</li>
                  <li>好きな画像を <span className="text-blue-700 bg-white px-3 py-1 rounded-lg border-2 border-blue-400 inline-block shadow-sm transform scale-110">長おし</span> する</li>
                  <li>「<span className="text-red-600 bg-white px-3 py-1 rounded-lg border-2 border-red-400 inline-block shadow-sm">画像アドレスをコピー</span>」をえらぶ</li>
                  <li>下の はこに <span className="font-bold border-b-4 border-gray-500 pb-1">貼りつける（ペースト）</span></li>
                </ol>
              </div>
              
              <div className="space-y-6">
                {answers.map((ans, idx) => (
                  <div key={idx} className="bg-gray-50 p-4 rounded-xl border-2 border-gray-200 shadow-sm hover:border-blue-300 transition-colors">
                    <p className="font-bold text-gray-700 mb-2">👤 {idx+1}人目: <span className="text-blue-600 text-lg">{ans.name}</span> ({ans.pronoun} / {ans.action})</p>
                    <input type="text" value={ans.img || ''} onChange={e => {
                      const newAns = [...answers];
                      newAns[idx].img = e.target.value;
                      setAnswers(newAns);
                    }} placeholder="https://... (ここで はりつけ)" className="w-full p-4 border-2 border-gray-300 rounded-xl text-sm font-bold focus:outline-none focus:border-blue-500 bg-white mb-2" />
                    {ans.img && (
                      <div className="relative mt-2">
                        <img src={ans.img} alt="preview" onError={(e) => {e.target.style.display='none'; e.target.parentElement.innerHTML = '<div class="text-red-500 font-bold bg-red-50 p-3 rounded-lg border-2 border-red-200 text-sm">画像が読み込めません💦 別のアドレスをためしてね！</div>';}} className="h-32 object-cover rounded-lg shadow-md border border-gray-300" />
                      </div>
                    )}
                  </div>
                ))}
              </div>
              <button onClick={() => setStep('NOTE_WRITE')} className="w-full mt-8 bg-blue-500 hover:bg-blue-600 text-white text-xl font-bold py-5 rounded-2xl shadow-lg transition transform hover:-translate-y-1">がぞうを いれた！ ▶️</button>
            </div>
          </div>
        );
      } else if (step === 'NOTE_WRITE') {
        content = (
          <div className="min-h-screen bg-yellow-50 p-4 flex flex-col items-center py-8 relative">
            <BackButton />
            <div className="w-full max-w-2xl bg-white p-8 rounded-3xl shadow-xl border-4 border-yellow-300 mt-8">
              <h2 className="text-3xl font-bold text-yellow-700 mb-6 text-center">📝 ノートに 書きうつそう！</h2>
              <p className="text-center font-bold text-gray-600 mb-6">下の えいごを、じぶんの ノートに 書いてね。<br/>書きおわったら、<span className="text-red-500 bg-red-100 px-2 py-1 rounded">先生に チェックしてもらおう！</span></p>
              
              <div className="bg-[url('https://www.transparenttextures.com/patterns/lined-paper-2.png')] bg-white border-2 border-gray-300 p-6 md:p-10 rounded-xl shadow-inner mb-8">
                {renderNoteLines(answers, false)}
              </div>
              
              {!showNoteConfirm ? (
                <button onClick={() => setShowNoteConfirm(true)} className="w-full bg-red-500 hover:bg-red-600 text-white text-xl font-bold py-5 rounded-2xl shadow-lg transition flex items-center justify-center gap-2"><span>🙋</span> 先生をよぶ（チェックがめんへ）</button>
              ) : (
                <div className="bg-red-50 p-6 rounded-2xl border-4 border-red-300 animate-fade-in-up shadow-md text-center">
                  <p className="font-bold text-red-700 text-xl mb-6">本当に ノートに ぜんぶ 書きましたか？</p>
                  <div className="flex flex-col sm:flex-row gap-4 justify-center">
                    <button onClick={() => setStep('TEACHER_CHECK')} className="bg-red-500 hover:bg-red-600 text-white font-bold py-4 px-8 rounded-xl shadow-md w-full sm:w-1/2 transition">はい！書きました</button>
                    <button onClick={() => setShowNoteConfirm(false)} className="bg-gray-300 hover:bg-gray-400 text-gray-700 font-bold py-4 px-8 rounded-xl shadow-md w-full sm:w-1/2 transition">まだです</button>
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      } else if (step === 'TEACHER_CHECK') {
        content = (
          <div className="min-h-screen bg-red-50 p-4 flex flex-col items-center py-8 relative">
            <BackButton />
            <div className="w-full max-w-2xl bg-white p-8 rounded-3xl shadow-2xl border-8 border-red-400 relative mt-8">
              <div className="absolute -top-6 left-1/2 transform -translate-x-1/2 bg-red-500 text-white px-6 py-2 rounded-full font-bold text-xl shadow-md">先生専用画面</div>
              <p className="text-center font-bold text-gray-700 mt-6 mb-6">児童のノートを確認し、必要であれば以下の英文を手直ししてください。<br/>修正はスライドに反映されます。</p>
              
              <div className="bg-gray-50 border-2 border-gray-300 p-6 rounded-xl mb-8">
                {renderNoteLines(answers, true)}
              </div>
              
              <button onClick={() => setStep('SPEAK_PRACTICE')} className="w-full bg-green-500 hover:bg-green-600 text-white text-xl font-bold py-5 rounded-2xl shadow-lg transition transform hover:-translate-y-1">✅ チェック完了（練習へすすむ）</button>
            </div>
          </div>
        );
      } else if (step === 'SPEAK_PRACTICE') {
        const isAllDone = currentSpeakLine >= answers.length;
        
        content = (
          <div className="min-h-screen bg-green-50 p-4 flex flex-col items-center py-8 relative">
            <BackButton />
            <div className="w-full max-w-2xl bg-white p-8 rounded-3xl shadow-xl border-4 border-green-300 text-center mt-8">
              <h2 className="text-3xl font-bold text-green-700 mb-6">🗣️ えいごで はなす れんしゅう</h2>
              <div className="space-y-4 mb-8">
                {answers.map((ans, idx) => {
                  const isActive = idx === currentSpeakLine;
                  const isDone = idx < currentSpeakLine;
                  const sentence = `${ans.pronoun} can ${ans.en}.`;
                  return (
                    <div key={idx} className={`p-4 rounded-xl border-2 text-left flex justify-between items-center transition-all ${isActive ? 'bg-green-100 border-green-400 transform scale-105 shadow-md' : isDone ? 'bg-gray-100 border-gray-200 opacity-50' : 'bg-white border-gray-200 opacity-40'}`}>
                      <span className={`text-xl md:text-2xl font-bold font-note ${isDone ? 'line-through text-gray-500' : 'text-gray-800'}`}>{idx+1}. {sentence}</span>
                      {isActive && <button onClick={() => speak(sentence)} className="bg-white p-3 rounded-full text-green-600 shadow border border-green-200">🔊</button>}
                      {isDone && <span className="text-green-500 text-3xl">✓</span>}
                    </div>
                  );
                })}
              </div>

              {!isAllDone ? (
                <div>
                  <button onClick={() => startListening(`${answers[currentSpeakLine].pronoun} can ${answers[currentSpeakLine].en}`)} disabled={isListening} className={`w-24 h-24 rounded-full shadow-lg text-4xl mb-4 ${isListening ? 'bg-red-500 animate-pulse' : 'bg-blue-500 hover:bg-blue-600'} text-white transition`}>🎤</button>
                  <p className="font-bold text-gray-600">{isListening ? "はなしてね..." : "マイクをおして はなす"}</p>
                  {feedbackMsg && <div className="mt-4 p-4 rounded-xl font-bold text-lg border-2 bg-white whitespace-pre-line">{feedbackMsg}</div>}
                  
                  {failCount >= 2 && (
                    <div className="mt-6 animate-fade-in-up">
                        <p className="text-sm text-gray-500 mb-2 font-bold">むずかしい場合はスキップできます。</p>
                        <button onClick={() => { setCurrentSpeakLine(c => c+1); setFailCount(0); setFeedbackMsg(""); }} className="text-sm bg-gray-200 hover:bg-gray-300 px-6 py-3 rounded-full font-bold transition text-gray-700 shadow-sm border border-gray-300">⏭️ スキップして次へ</button>
                    </div>
                  )}
                </div>
              ) : (
                <div className="animate-bounce-in">
                  <p className="text-2xl font-bold text-orange-500 mb-6">ぜんぶ 言えたね！🎉</p>
                  <button onClick={() => setStep('GAME_INTRO')} className="w-full bg-yellow-500 hover:bg-yellow-600 text-yellow-900 text-2xl font-bold py-6 rounded-2xl shadow-xl transition transform hover:scale-105 flex items-center justify-center gap-2"><span>🎮</span> ゲームへ！ ▶️</button>
                </div>
              )}
            </div>
          </div>
        );
      } else if (step === 'GAME_INTRO') {
        content = (
          <div className="min-h-screen bg-green-50 p-4 flex items-center justify-center relative">
            <BackButton />
            <div className="max-w-lg w-full bg-white rounded-3xl shadow-xl p-8 text-center border-4 border-green-200 mt-12">
              <h2 className="text-3xl font-bold text-green-600 mb-6">コインあつめ ゲーム！</h2>
              <div className="bg-green-100 p-6 rounded-2xl mb-8">
                <div className="text-6xl mb-4 flex justify-center items-center gap-2">
                  <span>🪙</span>
                  <span className="animate-bounce">{currentStage.emoji}</span>
                </div>
                <p className="text-lg font-bold text-gray-700 leading-relaxed text-left bg-white p-4 rounded-xl shadow-sm">
                  えいごの 練習 おつかれさま！<br/>ゲームだよ。<br/>
                  <br/>
                  やじるしキー や ボタンを おして<br/>
                  <span className="text-blue-600">{currentStage.name}</span> を うごかそう！<br/>
                  <br/>
                  <span className="text-red-500 text-xl font-black">15秒</span>の間に コインを あつめてね！<br/>
                  エイリアン（👾）に ぶつかると しばらく うごけなくなるよ！<br/>
                  <br/>
                  {helpers.length > 0 && <span className="text-purple-600 text-sm font-bold">集まった お助けキャラ が エイリアンを やっつけてくれるよ！</span>}
                </p>
              </div>
              <button onClick={() => setStep('GAME')} className="bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-12 rounded-full text-2xl shadow-md w-full transition transform hover:scale-105">スタート！</button>
            </div>
          </div>
        );
      } else if (step === 'GAME') {
         content = (
           <div className="min-h-screen bg-gray-900 flex items-center justify-center p-4 relative">
              <CoinGame playerEmoji={currentStage.emoji} helpers={helpers} onFinish={handleGameFinish} />
           </div>
         );
      } else if (step === 'FRIEND_SHARE') {
        content = (
          <div className="min-h-screen bg-indigo-50 p-4 flex items-center justify-center relative">
            <div className="max-w-lg w-full bg-white rounded-3xl shadow-xl p-8 text-center border-4 border-indigo-200 animate-fade-in-up">
              <h2 className="text-3xl font-bold text-indigo-600 mb-6">ゲーム おつかれさま！</h2>
              <div className="text-6xl mb-6">🎉</div>
              <p className="text-2xl font-bold text-gray-700 mb-4">ぜんぶで <span className="text-yellow-500 text-4xl">{totalCoins}</span> コインになったよ！</p>
              
              <div className="bg-indigo-100 p-6 rounded-2xl mb-8 mt-6">
                <p className="text-indigo-800 font-bold text-xl leading-relaxed">
                  できあがった スライドを<br/>
                  <span className="text-red-500 text-2xl">近くの友だちに見せよう！</span>
                </p>
              </div>
              
              <button onClick={() => {
                const workData = { date: new Date().toLocaleString(), answers };
                saveWork(workData);
                setViewingWork(workData);
                setStep('VIEW_SLIDESHOW');
                setCurrentSlideIndex(0);
              }} className="bg-blue-500 hover:bg-blue-600 text-white text-xl font-bold py-5 px-8 rounded-full flex items-center justify-center mx-auto shadow-md transform transition hover:scale-105 w-full">
                 🙋 近くの友だちに見せる！
              </button>
            </div>
          </div>
        );
      } else if (step === 'VIEW_SLIDESHOW') {
        const workData = viewingWork;
        const ans = workData.answers[currentSlideIndex];
        const sentence = `${ans.pronoun} can ${ans.en}.`;
        
        const toggleFullscreen = () => {
          const elem = document.getElementById('slide-fullscreen-container');
          if (!elem) return;
          if (!document.fullscreenElement) {
            elem.requestFullscreen().catch(err => alert("お使いのブラウザは全画面表示に対応していません"));
          } else {
            document.exitFullscreen();
          }
        };

        content = (
          <div id="slide-fullscreen-container" className="fixed inset-0 bg-black flex flex-col z-50">
            <div className="flex-1 flex items-center justify-center p-2 md:p-8">
              <div className="w-full h-full max-h-[70vh] max-w-5xl slide-bg rounded-xl md:rounded-3xl shadow-[0_0_50px_rgba(255,255,255,0.2)] overflow-hidden relative flex flex-col border-4 border-gray-800">
                <button onClick={() => { 
                  if (document.fullscreenElement) document.exitFullscreen(); 
                  setStep('HOME'); setViewingWork(null); 
                }} className="absolute top-4 left-4 bg-black/50 text-white px-4 py-2 rounded-full font-bold z-10 hover:bg-black/70">✖ 近くの友だちに スライドを見せた！</button>
                
                <button onClick={toggleFullscreen} className="absolute top-4 right-20 bg-gray-800/80 text-white w-12 h-12 rounded-full flex items-center justify-center text-xl shadow-lg z-10 hover:bg-gray-700 border border-gray-600 backdrop-blur" title="全画面表示">⛶</button>
                <button onClick={() => speak(sentence)} className="absolute top-4 right-4 bg-blue-500 text-white w-12 h-12 rounded-full flex items-center justify-center text-2xl shadow-lg z-10 hover:bg-blue-600 border-2 border-white">🔊</button>
                
                <div className="flex-1 min-h-0 w-full flex items-center justify-center bg-gray-900 relative">
                  {ans.img ? (
                    <img src={ans.img} alt="slide" onError={(e) => {e.target.src="https://placehold.co/800x600/222222/ff3333?text=Error:+Cannot+load+image.\nPlease+try+another+URL.";}} className="w-full h-full object-contain" />
                  ) : (
                    <div className="text-gray-500 font-bold text-2xl">がぞう は ありません</div>
                  )}
                </div>
                
                <div className="shrink-0 w-full bg-black px-4 py-4 md:py-6 flex flex-col items-center justify-center text-center border-t-2 border-gray-800">
                  <p className="text-white text-xl md:text-3xl font-bold font-note leading-tight">{sentence}</p>
                </div>
              </div>
            </div>
            
            <div className="absolute inset-y-0 left-2 md:left-6 flex items-center z-40">
               <button onClick={() => setCurrentSlideIndex(Math.max(0, currentSlideIndex - 1))} className={`text-white text-5xl md:text-7xl p-2 transition hover:scale-110 active:scale-95 drop-shadow-md ${currentSlideIndex === 0 ? 'invisible' : ''}`}>◀</button>
            </div>
            <div className="absolute inset-y-0 right-2 md:right-6 flex items-center z-40">
               <button onClick={() => setCurrentSlideIndex(Math.min(workData.answers.length - 1, currentSlideIndex + 1))} className={`text-white text-5xl md:text-7xl p-2 transition hover:scale-110 active:scale-95 drop-shadow-md ${currentSlideIndex === workData.answers.length - 1 ? 'invisible' : ''}`}>▶</button>
            </div>
          </div>
        );
      } else if (step === 'VIEW_WORKSHEET' && viewingWork) {
        content = (
          <div className="min-h-screen bg-yellow-50 p-4 flex flex-col items-center py-8 relative">
            <BackButton />
            <div className="w-full max-w-2xl bg-white p-8 rounded-3xl shadow-xl border-4 border-yellow-300 relative mt-12">
              <h2 className="text-2xl font-bold text-gray-700 mb-6">📑 {viewingWork.date} のノート</h2>
              <div className="bg-[url('https://www.transparenttextures.com/patterns/lined-paper-2.png')] bg-white border-2 border-gray-300 p-6 md:p-10 rounded-xl shadow-inner mb-4">
                {renderNoteLines(viewingWork.answers, false)}
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen relative touch-manipulation">
          {content}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
